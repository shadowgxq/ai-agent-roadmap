name: Support offline checks
on:
  pull_request:
    paths: ['support-agent/**', 'advanced-coding-agent/**', 'frontend/**', 'deploy/**', 'compose.support.yaml', '.github/workflows/support-offline.yml']
  workflow_dispatch:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {python-version: '3.12'}
      - run: uv sync --project support-agent --group dev --frozen
      - working-directory: support-agent
        env: {SUPPORT_APP_TRACING_ENABLED: 'false', LANGCHAIN_TRACING_V2: 'false'}
        run: |
          uv run pytest -q tests
          PYTHONPATH=../advanced-coding-agent/src uv run pytest -q ../advanced-coding-agent/tests
          uv run python -m compileall -q src migrations
          uv run alembic upgrade head --sql > /tmp/support-migration.sql
          uv run support-eval --config evals/w21_offline_recommended.json --output /tmp/support-eval.json
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: corepack enable
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm exec eslint src/pages/support src/app/router/routes.tsx --max-warnings=0
          pnpm exec vitest run src/pages/support/model/support.types.test.ts src/pages/support/model/useRunTimeline.test.tsx src/pages/support/ui/LoginPanel/LoginPanel.test.tsx src/app/router/AppRouter.test.tsx

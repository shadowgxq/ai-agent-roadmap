[project]
name = "advanced-coding-agent"
version = "0.1.0"
description = "W16-W18 planning and long-horizon coding-agent experiments"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
advanced-coding-agent = "advanced_coding_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

task: |
  结算模块的运费规则存在边界错误。请查明正确规则，结合本地代码修复实现，
  并运行完整测试确认结果。
eval_type: command
difficulty: L4
capabilities:
  - mcp
  - tool_selection
  - multi_file
  - verification
suite: [core, full]
mcp_config_file: mcp_servers.json
tool_mode: all
verify_cmd: uv run --with pytest python -m pytest -q
timeout_s: 120
max_cost_usd: 1.5

task: |
  结算模块的运费规则存在边界错误。请先使用可用的知识 MCP 工具查明规则，
  再结合本地代码修复实现，并运行完整测试确认结果。
eval_type: command
difficulty: L4
capabilities:
  - mcp
  - tool_selection
  - multi_file
  - verification
suite: [core, full]
mcp_config_file: mcp_servers.json
tool_mode: all
verify_cmd: uv run --with pytest python -m pytest -q
timeout_s: 120
max_cost_usd: 1.5

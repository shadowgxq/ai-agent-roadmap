<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap"
      rel="stylesheet"
    />
    <title>AI Agent Roadmap</title>
    <script>
      // No-FOUC: 渲染前根据持久化的主题预设 <html data-theme>，与 shared/theme 一致。
      (function () {
        var mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        try {
          var raw = localStorage.getItem('ui-theme');
          var storedMode = raw ? JSON.parse(raw).state.mode : null;
          mode = storedMode === 'light' || storedMode === 'dark' ? storedMode : mode;
        } catch (e) {
          /* 忽略：localStorage 不可用时使用首次系统偏好 */
        }
        document.documentElement.dataset.theme = mode;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

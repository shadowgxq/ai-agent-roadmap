[project]
name = "mcp-server-lighthouse"
version = "0.1.0"
description = "Expose Lighthouse web audits through Model Context Protocol"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2,<3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0",
]

[project.scripts]
mcp-server-lighthouse = "server:main"
lighthouse-audit = "main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["lighthouse_runner", "main", "server"]

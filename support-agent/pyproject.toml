[project]
name = "support-agent"
version = "0.1.0"
description = "An enterprise support agent built with LangChain and LangGraph"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic-settings>=2.10.1",
    "pypdf>=5.0.0",
    "tiktoken>=0.8.0",
    "python-dotenv>=1.0.0",
    "alembic>=1.16.0",
    "sqlalchemy>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "celery[redis]>=5.5.0",
    "langfuse>=3.14.0,<4",
    "httpx>=0.27.0",
]

[project.scripts]
support-agent = "support_agent.cli:main"
support-app = "support_agent.application.cli:main"
support-eval = "support_agent.evaluation_cli:main"
support-eval-experiments = "support_agent.evaluation_experiments_cli:main"
support-knowledge = "support_agent.knowledge_cli:main"
support-knowledge-eval = "support_agent.knowledge_eval_cli:main"
support-knowledge-audit = "support_agent.knowledge_audit_cli:main"
support-ticket-rag = "support_agent.ticket_rag_cli:main"
support-knowledge-rerank = "support_agent.knowledge_rerank_cli:main"
support-routing = "support_agent.routing_cli:main"
support-ticket-contract = "support_agent.ticket_contract_cli:main"
support-ticket-workflow = "support_agent.ticket_workflow_cli:main"
support-ticket-events = "support_agent.ticket_event_cli:main"
support-ticket-acceptance = "support_agent.ticket_acceptance_cli:main"
support-ticket-checkpoint = "support_agent.ticket_checkpoint_cli:main"
support-ticket-store = "support_agent.ticket_store_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pyyaml>=6.0.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
